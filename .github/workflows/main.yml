name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
  runs-on: macos-15     
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project RomanticKeyboard.xcodeproj \
            -scheme RomanticKeyboard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/RomanticKeyboard.app Payload/
          zip -r RomanticKeyboard.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: RomanticKeyboard-ipa
          path: RomanticKeyboard.ipa
